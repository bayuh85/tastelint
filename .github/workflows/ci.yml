name: tastelint

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Scan the sample tree
        run: tastelint scan examples --format text --fail-under 0
      - name: Quiet studio stays above the gate
        run: tastelint scan examples/quiet-studio --fail-under 90
      - name: Sloppy sample fails a real gate
        run: |
          if tastelint scan examples/sloppy-landing --fail-under 90; then
            echo "expected examples/sloppy-landing to score under 90"
            exit 1
          fi
      - name: SARIF report
        run: tastelint scan examples/sloppy-landing --format sarif -o tastelint.sarif
